<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-label="Animated Roman Soldier with Gladius">
  <defs>
    
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117" />
      <stop offset="100%" stop-color="#161B22" />
    </linearGradient>

    
    <linearGradient id="greenTunic" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22C55E" />
      <stop offset="55%" stop-color="#15803D" />
      <stop offset="100%" stop-color="#14532D" />
    </linearGradient>

    
    <linearGradient id="ironGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="50%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#A16207" />
    </linearGradient>

    
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDBA74" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    
    <filter id="softGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  
  <rect x="12" y="12" width="736" height="396" rx="18" fill="url(#bgGrad)" stroke="#30363D" stroke-width="1.5" />

  
  <g transform="translate(565, 115)" filter="url(#softGlow)">
    <animateTransform attributeName="transform" type="scale" values="1; 1.03; 1" dur="3.6s" repeatCount="indefinite" additive="sum" />
    <path d="M 0,42 C -55,35 -75,-15 -42,-58" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" />
    <path d="M 0,42 C 55,35 75,-15 42,-58" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" />
    <ellipse cx="-48" cy="14" rx="14" ry="6" transform="rotate(-35 -48 14)" fill="url(#goldGrad)" />
    <ellipse cx="-58" cy="-12" rx="14" ry="6" transform="rotate(-55 -58 -12)" fill="url(#goldGrad)" />
    <ellipse cx="-48" cy="-38" rx="14" ry="6" transform="rotate(-75 -48 -38)" fill="url(#goldGrad)" />
    <ellipse cx="48" cy="14" rx="14" ry="6" transform="rotate(35 48 14)" fill="url(#goldGrad)" />
    <ellipse cx="58" cy="-12" rx="14" ry="6" transform="rotate(55 58 -12)" fill="url(#goldGrad)" />
    <ellipse cx="48" cy="-38" rx="14" ry="6" transform="rotate(75 48 -38)" fill="url(#goldGrad)" />
  </g>

  
  <g transform="translate(475, 225)" opacity="0.32" stroke="#8B949E" stroke-width="2" fill="#1F242D">
    <polygon points="90,0 180,36 0,36" />
    <rect x="10" y="36" width="160" height="104" />
    <rect x="26" y="46" width="14" height="84" />
    <rect x="62" y="46" width="14" height="84" />
    <rect x="98" y="46" width="14" height="84" />
    <rect x="134" y="46" width="14" height="84" />
  </g>

  
  <g id="roman-soldier" transform="translate(215, 42)">
    <animateTransform attributeName="transform" type="translate" values="215,42; 215,38; 215,42" dur="2.6s" repeatCount="indefinite" />

    
    <rect x="-34" y="218" width="22" height="98" rx="8" fill="url(#skinGrad)" stroke="#1E293B" stroke-width="2.5" />
    <rect x="14" y="218" width="22" height="98" rx="8" fill="url(#skinGrad)" stroke="#1E293B" stroke-width="2.5" />
    <rect x="-38" y="308" width="30" height="12" rx="4" fill="#78350F" stroke="#1E293B" stroke-width="2" />
    <rect x="10" y="308" width="30" height="12" rx="4" fill="#78350F" stroke="#1E293B" stroke-width="2" />
    <line x1="-34" y1="285" x2="-12" y2="298" stroke="#78350F" stroke-width="3" />
    <line x1="-12" y1="285" x2="-34" y2="298" stroke="#78350F" stroke-width="3" />
    <line x1="14" y1="285" x2="36" y2="298" stroke="#78350F" stroke-width="3" />
    <line x1="36" y1="285" x2="14" y2="298" stroke="#78350F" stroke-width="3" />

    
    <polygon points="-46,142 46,142 58,226 -58,226" fill="url(#greenTunic)" stroke="#1E293B" stroke-width="2.5" />
    
    <rect x="-14" y="140" width="8" height="44" rx="2" fill="url(#goldGrad)" stroke="#1E293B" stroke-width="1.5" />
    <rect x="-4" y="140" width="8" height="44" rx="2" fill="url(#goldGrad)" stroke="#1E293B" stroke-width="1.5" />
    <rect x="6" y="140" width="8" height="44" rx="2" fill="url(#goldGrad)" stroke="#1E293B" stroke-width="1.5" />

    
    <polygon points="-66,78 -38,74 -34,116 -62,120" fill="url(#greenTunic)" stroke="#1E293B" stroke-width="2.5" />
    <polygon points="66,78 38,74 34,116 62,120" fill="url(#greenTunic)" stroke="#1E293B" stroke-width="2.5" />
    <rect x="-40" y="74" width="80" height="72" rx="10" fill="url(#ironGrad)" stroke="#1E293B" stroke-width="2.5" />
    <line x1="-38" y1="96" x2="38" y2="96" stroke="#334155" stroke-width="2.5" />
    <line x1="-38" y1="114" x2="38" y2="114" stroke="#334155" stroke-width="2.5" />
    <line x1="-38" y1="132" x2="38" y2="132" stroke="#334155" stroke-width="2.5" />

    
    <rect x="46" y="114" width="18" height="62" rx="8" fill="url(#skinGrad)" stroke="#1E293B" stroke-width="2.5" />
    <circle cx="55" cy="182" r="10" fill="url(#skinGrad)" stroke="#1E293B" stroke-width="2.5" />

    
    <g transform="translate(-55, 116)">
      <animateTransform attributeName="transform" type="rotate" values="-4 -55 116; 7 -55 116; -4 -55 116" dur="2.4s" repeatCount="indefinite" additive="sum" />

      <rect x="-9" y="0" width="18" height="64" rx="8" fill="url(#skinGrad)" stroke="#1E293B" stroke-width="2.5" />
      <circle cx="0" cy="68" r="10" fill="url(#skinGrad)" stroke="#1E293B" stroke-width="2.5" />

      
      <g transform="translate(0, 74) rotate(-32)">
        
        <rect x="-4" y="-22" width="8" height="22" rx="3" fill="#78350F" stroke="#1E293B" stroke-width="2" />
        <circle cx="0" cy="-25" r="5" fill="url(#goldGrad)" stroke="#1E293B" stroke-width="1.5" />
        <rect x="-15" y="-3" width="30" height="7" rx="3" fill="url(#goldGrad)" stroke="#1E293B" stroke-width="2" />

        
        <polygon points="-8,4 8,4 8,86 0,104 -8,86" fill="url(#ironGrad)" stroke="#1E293B" stroke-width="2.2" />
        <line x1="0" y1="8" x2="0" y2="86" stroke="#F8FAFC" stroke-width="1.8" opacity="0.8" />

        
        <rect x="-7" y="8" width="14" height="18" rx="3" fill="#86EFAC" opacity="0.75" filter="url(#softGlow)">
          <animate attributeName="y" values="8; 72; 8" dur="2.2s" repeatCount="indefinite" />
        </rect>
      </g>
    </g>

    
    <circle cx="0" cy="46" r="22" fill="url(#skinGrad)" stroke="#1E293B" stroke-width="2.5" />
    
    <path d="M -26,22 C -26,-8 26,-8 26,22 Z" fill="url(#greenTunic)" stroke="#1E293B" stroke-width="2.5" />
    
    <path d="M -24,38 C -24,14 24,14 24,38 L 28,54 L 18,54 L 18,38 L -18,38 L -18,54 L -28,54 Z" fill="url(#ironGrad)" stroke="#1E293B" stroke-width="2.5" />
    
    <circle cx="-8" cy="46" r="2.5" fill="#0F172A" />
    <circle cx="8" cy="46" r="2.5" fill="#0F172A" />
  </g>

  
  <text x="565" y="378" text-anchor="middle" fill="#8B949E" font-family="monospace, sans-serif" font-size="13">
    GLADIUS // ROMAN GUARD EDITION
  </text>
</svg>
